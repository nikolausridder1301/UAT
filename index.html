<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IFS Loops Issue Log · Maximator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=21" />
</head>
<body>

<div class="masthead">
  <div class="masthead-brands">
    <img class="masthead-logo" src="assets/maximator-logo.webp" alt="Maximator" />
    <span class="masthead-divider">&times;</span>
    <img class="masthead-logo masthead-logo--loops" src="assets/loops-logo.svg" alt="Loops" />
  </div>
</div>

<div class="app">
  <div class="toolbar">
    <button id="openFormBtn" class="btn primary">+ New Issue</button>
    <span class="meta-label" id="entryCount"></span>
  </div>

  <div class="filter-bar">
    <select id="filterReportedBy">
      <option value="">Reported by: All</option>
    </select>
    <select id="filterOwner">
      <option value="">Loops Owner: All</option>
    </select>
    <select id="filterAgent">
      <option value="">Agent: All</option>
    </select>
    <select id="filterStatus">
      <option value="">Status: All</option>
      <option value="open">Open</option>
      <option value="in_progress">In Progress</option>
      <option value="resolved">Resolved</option>
      <option value="not_resolved" selected>Not Resolved</option>
    </select>
    <button type="button" id="filterResetBtn" class="filter-reset-link">Reset filters</button>
  </div>

  <div class="table-wrap">
    <table id="issueTable">
      <colgroup>
        <col style="width: 60px" />
        <col style="width: 95px" />
        <col style="width: 130px" />
        <col style="width: 340px" />
        <col style="width: 280px" />
        <col style="width: 100px" />
        <col style="width: 120px" />
        <col style="width: 140px" />
        <col style="width: 60px" />
      </colgroup>
      <thead>
        <tr>
          <th>ID</th>
          <th>Date</th>
          <th>Reported by</th>
          <th>Issue Explained</th>
          <th>Why?</th>
          <th>Screenshots</th>
          <th>Loops Owner</th>
          <th>Status</th>
          <th class="delete-cell"></th>
        </tr>
      </thead>
      <tbody id="issueTableBody">
        <tr><td colspan="9" class="empty-state">Loading entries…</td></tr>
      </tbody>
    </table>
  </div>

  <footer>
    <p>IFS Loops Issue Log &middot; Maximator</p>
  </footer>
</div>

<!-- New Issue Modal -->
<div id="formOverlay" class="overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2>New Issue</h2>
      <button id="closeFormBtn" class="btn icon">✕</button>
    </div>

    <form id="issueForm">
      <div class="field">
        <label for="fieldDate">Date</label>
        <input type="date" id="fieldDate" required />
      </div>

      <div class="field">
        <label for="fieldReportedBy">Reported by</label>
        <select id="fieldReportedBy" required></select>
      </div>

      <div class="field">
        <label for="fieldIssue">Issue Explained</label>
        <textarea id="fieldIssue" rows="4" required placeholder="What's the problem?"></textarea>
      </div>

      <div class="field">
        <label for="fieldWhy">Why?</label>
        <textarea id="fieldWhy" rows="3" placeholder="Why is this relevant? (optional)"></textarea>
      </div>

      <div class="field">
        <label for="fieldOwner">Loops Owner</label>
        <select id="fieldOwner" required></select>
      </div>

      <div class="field">
        <label for="fieldAgent">Agent</label>
        <select id="fieldAgent" required></select>
      </div>

      <div class="field">
        <label>Screenshots</label>
        <div id="pasteZone" class="paste-zone" tabindex="0">
          Paste a screenshot here (Ctrl+V) or click to select a file
          <input type="file" id="fileInput" accept="image/*" multiple hidden />
        </div>
        <div id="screenshotPreview" class="screenshot-preview"></div>
      </div>

      <div class="form-actions">
        <button type="button" id="cancelFormBtn" class="btn">Cancel</button>
        <button type="submit" class="btn primary" id="submitBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Screenshot Lightbox -->
<div id="lightbox" class="overlay hidden">
  <img id="lightboxImg" src="" alt="Screenshot" />
</div>

<!-- Resolve Modal -->
<div id="resolveOverlay" class="overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2>Resolve Issue</h2>
      <button id="closeResolveBtn" class="btn icon">✕</button>
    </div>

    <form id="resolveForm">
      <div class="field">
        <label for="resolveBy">Resolved by</label>
        <select id="resolveBy" required></select>
      </div>

      <div class="field">
        <label for="resolveComment">Comment</label>
        <textarea id="resolveComment" rows="3" placeholder="How was this issue resolved? (optional)"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" id="cancelResolveBtn" class="btn">Cancel</button>
        <button type="submit" class="btn primary" id="resolveSubmitBtn">Resolve</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Modal -->
<div id="editOverlay" class="overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2>Edit Issue</h2>
      <button id="closeEditBtn" class="btn icon">✕</button>
    </div>
    <div id="editBody" class="edit-body"></div>
  </div>
</div>

<!-- Detail Modal -->
<div id="detailOverlay" class="overlay hidden">
  <div class="modal modal-wide">
    <div class="modal-header">
      <h2 id="detailTitle">Issue</h2>
      <button id="closeDetailBtn" class="btn icon">✕</button>
    </div>
    <div id="detailBody" class="detail-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="config.js?v=21" defer></script>
<script src="app.js?v=21" defer></script>
</body>
</html>
