<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UAT Issue Log – Maximator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="masthead">
  <div class="masthead-brands">
    <img class="masthead-logo" src="assets/maximator-logo.webp" alt="Maximator" />
    <span class="masthead-divider">&times;</span>
    <img class="masthead-logo masthead-logo--loops" src="assets/loops-logo.svg" alt="Loops" />
  </div>
</div>

<div class="app">
  <header class="app-header panel">
    <div class="header-title">
      <div>
        <h1>UAT Issue Log</h1>
        <p class="subtitle">Issue Tracking</p>
      </div>
    </div>
    <button id="openFormBtn" class="btn primary">+ Neuer Eintrag</button>
  </header>

  <div class="toolbar">
    <span class="meta-label" id="entryCount"></span>
  </div>

  <div class="table-wrap">
    <table id="issueTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Datum</th>
          <th>Reported by</th>
          <th>Issue Explained</th>
          <th>Why?</th>
          <th>Screenshots</th>
          <th>Resolved</th>
          <th>Owner</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="issueTableBody">
        <tr><td colspan="9" class="empty-state">Lade Einträge…</td></tr>
      </tbody>
    </table>
  </div>

  <footer>
    <p>UAT Issue Log &middot; Maximator</p>
  </footer>
</div>

<!-- Formular Modal -->
<div id="formOverlay" class="overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2>Neuer Issue</h2>
      <button id="closeFormBtn" class="btn icon">✕</button>
    </div>

    <form id="issueForm">
      <div class="field">
        <label for="fieldDate">Datum</label>
        <input type="date" id="fieldDate" required />
      </div>

      <div class="field">
        <label for="fieldReportedBy">Reported by</label>
        <select id="fieldReportedBy" required></select>
      </div>

      <div class="field">
        <label for="fieldIssue">Issue Explained</label>
        <textarea id="fieldIssue" rows="4" required placeholder="Was ist das Problem?"></textarea>
      </div>

      <div class="field">
        <label for="fieldWhy">Why?</label>
        <textarea id="fieldWhy" rows="3" placeholder="Warum ist das relevant? (optional)"></textarea>
      </div>

      <div class="field">
        <label for="fieldOwner">Owner</label>
        <select id="fieldOwner" required></select>
      </div>

      <div class="field">
        <label class="checkbox-label">
          <input type="checkbox" id="fieldResolved" />
          Resolved
        </label>
      </div>

      <div class="field">
        <label>Screenshots</label>
        <div id="pasteZone" class="paste-zone" tabindex="0">
          Screenshot hier einfügen (Strg+V) oder klicken zum Auswählen
          <input type="file" id="fileInput" accept="image/*" multiple hidden />
        </div>
        <div id="screenshotPreview" class="screenshot-preview"></div>
      </div>

      <div class="form-actions">
        <button type="button" id="cancelFormBtn" class="btn">Abbrechen</button>
        <button type="submit" class="btn primary" id="submitBtn">Speichern</button>
      </div>
    </form>
  </div>
</div>

<!-- Screenshot Lightbox -->
<div id="lightbox" class="overlay hidden">
  <img id="lightboxImg" src="" alt="Screenshot" />
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="config.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
